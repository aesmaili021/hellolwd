<!doctype html>
<html lang="en" data-locale="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B3D5C" />
    <title>HelloLWD</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b3d5c;
        color: #fff;
        font-family: Manrope, Vazirmatn, ui-sans-serif, system-ui, sans-serif;
        padding: 24px;
      }
      main { max-width: 28rem; }
      p.kicker {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #01a0e2;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.78);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">HelloLWD</p>
      <h1 id="title">You're offline</h1>
      <p id="body">Open the site again when you're back. The briefing needs a connection.</p>
    </main>
    <script>
      var copy = {
        nl: ["Je bent offline", "Open de site opnieuw als je verbinding hebt. De briefing heeft internet nodig."],
        en: ["You're offline", "Open the site again when you're back. The briefing needs a connection."],
        es: ["Estás sin conexión", "Vuelve a abrir el sitio cuando tengas internet. El briefing necesita conexión."],
        fa: ["آفلاین هستی", "وقتی وصل شدی دوباره سایت را باز کن. بریفینگ به اینترنت نیاز دارد."]
      };
      var locale = "en";
      try {
        var stored = localStorage.getItem("hellolwd.locale");
        if (copy[stored]) locale = stored;
      } catch (e) {}
      if (document.documentElement.getAttribute("data-from-sw") === "1") {
        var injected = document.documentElement.getAttribute("data-locale");
        if (copy[injected]) locale = injected;
      }
      document.documentElement.lang = locale;
      document.documentElement.dir = locale === "fa" ? "rtl" : "ltr";
      document.getElementById("title").textContent = copy[locale][0];
      document.getElementById("body").textContent = copy[locale][1];
    </script>
  </body>
</html>
